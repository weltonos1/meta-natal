<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FitCouple Pro - Meta Natal 🎄</title>

  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitCouple">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.4);
    }
  </style>
</head>
<body class="h-full flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- HEADER / PERFIS -->
  <header class="glass-card sticky top-0 z-50 px-4 py-3 border-b border-slate-800 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-tree"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-white leading-tight">FitCouple Pro</h1>
        <p class="text-[10px] text-emerald-400 font-medium">Meta Natal 🎄</p>
      </div>
    </div>

    <!-- Seletor de Perfil -->
    <div class="flex bg-slate-900/90 p-1 rounded-xl border border-slate-800">
      <button id="btn-welton" onclick="switchProfile('Welton')" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 flex items-center space-x-1.5 bg-emerald-500 text-slate-950 shadow-md">
        <i class="fa-solid fa-mars"></i>
        <span>Welton</span>
      </button>
      <button id="btn-andressa" onclick="switchProfile('Andressa')" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 flex items-center space-x-1.5 text-slate-400 hover:text-white">
        <i class="fa-solid fa-venus"></i>
        <span>Andressa</span>
      </button>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 overflow-y-auto p-4 space-y-4 pb-20 max-w-md mx-auto w-full">

    <!-- RESUMO DO PERFIL ATUAL -->
    <div class="glass-card p-4 rounded-2xl shadow-xl relative overflow-hidden">
      <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-emerald-500/10 rounded-full blur-xl pointer-events-none"></div>
      <div class="flex justify-between items-start mb-3">
        <div>
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Perfil Ativo</span>
          <h2 id="current-profile-name" class="text-xl font-black text-white">Welton</h2>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80">
          <span class="text-[10px] text-slate-400 block">Inicial</span>
          <span id="stat-initial" class="text-sm font-bold text-slate-200">-- kg</span>
        </div>
        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80">
          <span class="text-[10px] text-slate-400 block">Atual</span>
          <span id="stat-current" class="text-sm font-bold text-emerald-400">-- kg</span>
        </div>
        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80">
          <span class="text-[10px] text-slate-400 block">Meta Natal</span>
          <span id="stat-goal" class="text-sm font-bold text-teal-300">-- kg</span>
        </div>
      </div>
    </div>

    <!-- SEÇÃO: METAS SEMANAIS PERSONALIZADAS -->
    <div class="glass-card p-4 rounded-2xl space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center space-x-2">
          <i class="fa-solid fa-bullseye text-emerald-400"></i>
          <span>Metas Semanais Personalizadas</span>
        </h3>
      </div>

      <!-- Formulário Nova Meta Semanal -->
      <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-2.5">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] font-medium text-slate-400 block mb-1">Início da Semana</label>
            <input type="date" id="goal-start-date" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[10px] font-medium text-slate-400 block mb-1">Fim da Semana</label>
            <input type="date" id="goal-end-date" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          </div>
        </div>
        <div>
          <label class="text-[10px] font-medium text-slate-400 block mb-1">Meta de Peso a Eliminar (ex: -1.0 kg)</label>
          <input type="text" id="goal-weight-target" placeholder="Ex: -1.0 kg" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
        </div>
        <button onclick="addWeeklyGoal()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold py-2 rounded-lg text-xs transition-transform active:scale-95 shadow-md shadow-emerald-500/20">
          <i class="fa-solid fa-plus mr-1"></i> Adicionar Meta Semanal
        </button>
      </div>

      <!-- Lista de Metas Semanais Salvas -->
      <div id="weekly-goals-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
        <!-- Injetado via JS -->
      </div>
    </div>

    <!-- REGISTO RÁPIDO DE PESO -->
    <div class="glass-card p-4 rounded-2xl space-y-3">
      <h3 class="text-sm font-bold text-white flex items-center space-x-2">
        <i class="fa-solid fa-weight-scale text-emerald-400"></i>
        <span>Registar Peso de Hoje</span>
      </h3>
      <div class="flex space-x-2">
        <input type="number" step="0.1" id="weight-input" placeholder="Ex: 78.5" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        <button onclick="saveWeight()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition-transform active:scale-95 shadow-md shadow-emerald-500/20">
          Guardar
        </button>
      </div>
    </div>

  </main>

  <script>
    let currentProfile = 'Welton';

    function switchProfile(profile) {
      currentProfile = profile;
      document.getElementById('current-profile-name').innerText = profile;
      
      const btnW = document.getElementById('btn-welton');
      const btnA = document.getElementById('btn-andressa');

      if (profile === 'Welton') {
        btnW.className = "px-3 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 flex items-center space-x-1.5 bg-emerald-500 text-slate-950 shadow-md";
        btnA.className = "px-3 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 flex items-center space-x-1.5 text-slate-400 hover:text-white";
      } else {
        btnA.className = "px-3 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 flex items-center space-x-1.5 bg-emerald-500 text-slate-950 shadow-md";
        btnW.className = "px-3 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 flex items-center space-x-1.5 text-slate-400 hover:text-white";
      }
    }

    function addWeeklyGoal() {
      const start = document.getElementById('goal-start-date').value;
      const end = document.getElementById('goal-end-date').value;
      const target = document.getElementById('goal-weight-target').value;

      if (!start || !end || !target) {
        alert('Por favor, preencha todos os campos da meta semanal!');
        return;
      }

      const list = document.getElementById('weekly-goals-list');
      const item = document.createElement('div');
      item.className = "bg-slate-900/60 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs";
      item.innerHTML = `
        <div>
          <span class="text-emerald-400 font-bold">${start} até ${end}</span>
          <p class="text-slate-300">Meta: <b>${target}</b> (${currentProfile})</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i></button>
      `;
      list.appendChild(item);

      document.getElementById('goal-start-date').value = '';
      document.getElementById('goal-end-date').value = '';
      document.getElementById('goal-weight-target').value = '';
    }

    function saveWeight() {
      const w = document.getElementById('weight-input').value;
      if (!w) {
        alert('Insira um valor de peso válido!');
        return;
      }
      document.getElementById('stat-current').innerText = w + ' kg';
      document.getElementById('weight-input').value = '';
      alert('Peso guardado com sucesso!');
    }
  </script>
</body>
</html>
